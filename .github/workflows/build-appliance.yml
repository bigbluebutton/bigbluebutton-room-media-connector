---
name: 📦 Build Appliance electon app
on:
  push:
#    branches: [ "main"]
#    paths:
#      - 'appliance-application/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'appliance-application/**'


jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 16.x

      - name: Install system dependencies on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt -y update
          sudo apt install -y g++-12 build-essential pkg-config libudev-dev libusb-1.0-0 libusb-1.0-0-dev
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100

      - name: Install dependencies
        run: npm install
        working-directory: appliance-application


      - name: Build
        run: npm run compile
        working-directory: appliance-application
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
            name: appliance-application-${{ matrix.os }}
            path: appliance-application/dist